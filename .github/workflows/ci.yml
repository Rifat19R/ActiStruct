name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install CPU-only torch first so pip does not pull the full CUDA
          # build (~2-3 GB) when it processes requirements.txt.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install -e ".[test]"
      - name: Syntax checks
        run: |
          python -m py_compile qe_active_inverse_common.py
          python -m py_compile generated_models/*.py
          python -m py_compile tests/*.py
      - name: Run tests
        run: |
          pytest --tb=line -q 2>&1 | tee /tmp/pytest_out.txt
          exit ${PIPESTATUS[0]}
      - name: Write pytest output to repo for inspection
        if: failure()
        run: |
          CONTENT=$(base64 -w0 /tmp/pytest_out.txt)
          FNAME="debug/pytest-py${{ matrix.python-version }}-$(date +%s).txt"
          curl -s -X PUT \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/Rifat19R/ActiStruct/contents/$FNAME" \
            -d "{\"message\":\"ci debug\",\"content\":\"$CONTENT\",\"branch\":\"feature/tmc-reliability-benchmark\"}" \
            -o /tmp/api_resp.json
          cat /tmp/api_resp.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('content',{}).get('html_url','') or d.get('message',''))" || true
