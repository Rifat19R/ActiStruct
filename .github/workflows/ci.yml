name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install CPU-only torch first so pip does not pull the full CUDA
          # build (~2-3 GB) when it processes requirements.txt.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install -e ".[test]"
      - name: Syntax checks
        run: |
          python -m py_compile qe_active_inverse_common.py
          python -m py_compile generated_models/*.py
          python -m py_compile tests/*.py
      - name: Run tests
        run: |
          pytest --tb=line -q 2>&1 | tee /tmp/pytest_out.txt
          exit ${PIPESTATUS[0]}
      - name: Upload failure summary
        if: failure()
        run: |
          echo "## pytest output (Python ${{ matrix.python-version }})" >> $GITHUB_STEP_SUMMARY
          cat /tmp/pytest_out.txt >> $GITHUB_STEP_SUMMARY
