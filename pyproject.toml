[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "actistruct"
version = "2.0.0"
description = "Reliability-aware active learning for DFT structure exploration with Quantum ESPRESSO."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Md. Rifat Khandaker"}]
keywords = [
  "inverse-design",
  "active-learning",
  "dft",
  "quantum-espresso",
  "ase",
  "gaussian-process",
  "bayesian-optimization",
  "gnn",
  "schnet",
  "multi-fidelity",
  "materials-science",
  "mxene",
  "hydrogen-evolution",
  "atomistic-simulation",
  "structure-optimization",
]
dependencies = [
  "numpy<2.5",
  "scipy",
  "matplotlib",
  "scikit-learn",
  "ase",
  "torch",
  "pillow",
]

[project.optional-dependencies]
test = ["pytest>=8"]
dashboard = ["streamlit", "plotly", "stmol", "py3Dmol", "pandas"]
dev = ["pytest>=8", "black>=24", "ruff>=0.9"]

[project.urls]
Homepage = "https://github.com/Rifat19R/ActiStruct"
Repository = "https://github.com/Rifat19R/ActiStruct"
Issues = "https://github.com/Rifat19R/ActiStruct/issues"
Documentation = "https://github.com/Rifat19R/ActiStruct/blob/main/docs/index.md"

[tool.setuptools]
py-modules = ["qe_active_inverse_common"]
packages = [
  "actistruct",
  "actistruct.acquisition",
  "actistruct.datasets",
  "actistruct.parsers",
  "actistruct.core",
  "actistruct.debug",
  "actistruct.gnn",
  "actistruct.dashboard",
  "generated_models",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "slow: tests that may re-run analysis scripts or take longer than the default suite",
]
filterwarnings = [
    # ConvergenceWarning from sklearn GP is expected on small/synthetic test
    # datasets where the optimizer occasionally reaches the length-scale lower
    # bound (1e-2). StandardScaler eliminates this on real data. Suppressed
    # here because the bound value is correct and must not be changed.
    "ignore::sklearn.exceptions.ConvergenceWarning",
]
