[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "actistruct"
version = "2.0.0"
description = "Active-learning workflow for DFT-guided materials discovery: GNN+GP surrogate, autonomous QE fault recovery, multi-fidelity oracle, and Streamlit monitoring dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Md. Rifat Khandaker"}]
keywords = [
  "inverse-design",
  "active-learning",
  "dft",
  "quantum-espresso",
  "ase",
  "gaussian-process",
  "bayesian-optimization",
  "gnn",
  "schnet",
  "multi-fidelity",
  "materials-science",
  "mxene",
  "hydrogen-evolution",
  "atomistic-simulation",
  "structure-optimization",
  "reliability-aware-al",
]
dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "scikit-learn",
  "ase",
  "pillow",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/Rifat19R/ActiStruct"
Repository = "https://github.com/Rifat19R/ActiStruct"
Issues = "https://github.com/Rifat19R/ActiStruct/issues"

[tool.setuptools]
py-modules = ["qe_active_inverse_common"]
packages = [
  "actistruct",
  "actistruct.acquisition",
  "actistruct.datasets",
  "actistruct.parsers",
  "actistruct.core",
  "actistruct.debug",
  "actistruct.gnn",
  "actistruct.dashboard",
  "generated_models",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
