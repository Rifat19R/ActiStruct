fe_co5:
  name: Iron pentacarbonyl
  formula: Fe(CO)5
  charge: 0
  spin_or_multiplicity: null
  geometry_class: trigonal_bipyramidal
  symmetry: D3h (gas phase)
  reference_values:
    bond_lengths:
      - label: Fe-C axial
        value_angstrom: 1.810
        uncertainty_angstrom: 0.016
        source_id: mcclelland_et_al_2001
      - label: Fe-C equatorial
        value_angstrom: 1.842
        uncertainty_angstrom: 0.011
        source_id: mcclelland_et_al_2001
      - label: C-O axial
        value_angstrom: 1.142
        uncertainty_angstrom: 0.023
        source_id: mcclelland_et_al_2001
      - label: C-O equatorial
        value_angstrom: 1.149
        uncertainty_angstrom: 0.016
        source_id: mcclelland_et_al_2001
    angles: []
    relative_energies: []
    barriers: []
  sources:
    mcclelland_et_al_2001:
      type: literature
      title: "Iron Pentacarbonyl: Are the Axial or the Equatorial Iron-Carbon Bonds Longer in the Gaseous Molecule?"
      authors: "McClelland, Bruce W.; Robiette, Alan G.; Hedberg, Lise; Hedberg, Kenneth"
      year: 2001
      journal_or_database: "Inorganic Chemistry, 40(6), 1358-1362"
      doi: "10.1021/ic001114e"
      url_or_accession: "https://doi.org/10.1021/ic001114e"
      access_date: "2026-06-29"
      notes: >
        Gas-phase electron diffraction combined with B3LYP/6-311+G(d)
        calculations and IR spectroscopy, D3h symmetry assumed. Finds
        equatorial Fe-C bonds LONGER than axial in the gas phase (opposite
        ordering from the solid-state structure). Values and uncertainties
        quoted directly from the PubMed abstract (fetched 2026-06-29);
        DOI/journal/authors corroborated by an independent web search
        result. Full primary-text PDF not independently opened - abstract-
        level confidence only. Manual PDF check recommended before treating
        as fully verified.
  status: needs_manual_review
