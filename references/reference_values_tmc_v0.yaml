ferrocene:
  name: Ferrocene
  formula: Fe(C5H5)2
  charge: 0
  spin_or_multiplicity: null
  geometry_class: sandwich
  symmetry: D5h (gas phase, eclipsed); D5d (solid, >164 K, staggered); D5h (solid, <110 K, eclipsed)
  reference_values:
    bond_lengths:
      - label: Fe-C
        value_angstrom: 2.064
        uncertainty_angstrom: null
        source_id: haaland_nilsson_1968
        verification_date: "2026-07-14"
        verification_method: cross_verified_secondary
      - label: C-C (Cp ring)
        value_angstrom: 1.440
        uncertainty_angstrom: null
        source_id: haaland_nilsson_1968
        verification_date: "2026-07-14"
        verification_method: cross_verified_secondary
    angles: []
    relative_energies: []
    barriers: []
  sources:
    haaland_nilsson_1968:
      type: literature
      title: "The Determination of Barriers to Internal Rotation by Means of Electron Diffraction. Ferrocene and Ruthenocene."
      authors: "Haaland, A.; Nilsson, J. E."
      year: 1968
      journal_or_database: "Acta Chemica Scandinavica, 22, 2653-2670"
      doi: "10.3891/acta.chem.scand.22-2653"
      url_or_accession: "https://doi.org/10.3891/acta.chem.scand.22-2653"
      access_date: "2026-06-29"
      notes: >
        Primary gas-phase electron diffraction structure determination.
        TASK 4 VERIFICATION (2026-07-14): DOI confirmed to resolve (302 redirect
        to actachemscand.ki.ku.dk) with correct title/authors/journal/volume/year/
        pages. Full-text PDF not accessed (publisher page returns metadata-only
        view; no institutional access). Bond lengths Fe-C=2.064 A and C-C=1.440 A
        cross-verified from two independent secondary paths: (1) Wikipedia
        "Ferrocene" article cites CRC Handbook 85th ed (Lide 2004, p.3-282) which
        cites this paper for exactly these values; (2) Web search confirms
        "all Fe-C bond distances are 2.064 A" attributed to Haaland & Nilsson 1968.
        Uncertainty values not available from accessible sources; recorded as null.
        Status: values numerically confirmed via consistent secondary sourcing;
        primary PDF character-by-character check not performed.
    crc_handbook_85ed:
      type: database
      title: "CRC Handbook of Chemistry and Physics, 85th Edition, p. 3-282"
      authors: "Lide, David R. (ed.)"
      year: 2004
      journal_or_database: "CRC Press"
      doi: null
      url_or_accession: null
      access_date: "2026-06-29"
      notes: >
        Tertiary compilation citing Haaland & Nilsson 1968. Used as an
        intermediate verification path (Wikipedia cites CRC which cites the
        primary study). Not treated as primary source.
  status: cross_verified_secondary

