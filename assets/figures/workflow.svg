<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 300" role="img" aria-labelledby="title desc">
  <title id="title">ActiStruct reliability-aware active-learning workflow</title>
  <desc id="desc">Candidate space flows through acquisition to Quantum ESPRESSO, reliability records, evidence, and surrogate updates.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#58758a"/>
    </marker>
    <style>
      .box{fill:#f8fbfd;stroke:#254b62;stroke-width:2.5}
      .evidence{fill:#fff8e8;stroke:#b97918;stroke-width:2.5}
      .text{font:600 20px Inter,Segoe UI,Arial,sans-serif;fill:#102a3a;text-anchor:middle}
      .sub{font:15px Inter,Segoe UI,Arial,sans-serif;fill:#456273;text-anchor:middle}
      .line{fill:none;stroke:#58758a;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1160" height="300" rx="22" fill="#eef4f7"/>
  <rect class="box" x="35" y="82" width="190" height="118" rx="18"/>
  <text class="text" x="130" y="126">Candidate space</text>
  <text class="sub" x="130" y="157">structures + variables</text>
  <rect class="box" x="285" y="82" width="210" height="118" rx="18"/>
  <text class="text" x="390" y="120">Acquisition</text>
  <text class="sub" x="390" y="151">GP / GNN embedding</text>
  <text class="sub" x="390" y="174">+ failure risk</text>
  <rect class="box" x="555" y="82" width="210" height="118" rx="18"/>
  <text class="text" x="660" y="120">Quantum ESPRESSO</text>
  <text class="sub" x="660" y="151">selected DFT call</text>
  <text class="sub" x="660" y="174">or cached result</text>
  <rect class="box" x="825" y="28" width="295" height="102" rx="18"/>
  <text class="text" x="972" y="68">Reliability record</text>
  <text class="sub" x="972" y="98">parse · classify · retry · ledger</text>
  <rect class="evidence" x="825" y="170" width="295" height="102" rx="18"/>
  <text class="text" x="972" y="210">Scientific evidence</text>
  <text class="sub" x="972" y="240">JSONL · metadata · reports · hashes</text>
  <path class="line" d="M225 141h60"/>
  <path class="line" d="M495 141h60"/>
  <path class="line" d="M765 118 825 87"/>
  <path class="line" d="M972 130v40"/>
  <path class="line" d="M825 76C720 10 420 8 390 80"/>
  <text class="sub" x="600" y="34">update surrogate with successful and failed outcomes</text>
</svg>
