qe:
  executable: pw.x
  calculation: relax
  functional: PBE
  pseudo_family: SSSP_1.3.0_PBE_efficiency
  ecutwfc_ry: 60
  ecutrho_ry: 480
  occupations: fixed
  smearing: null
  kpoints: [1, 1, 1]
  gamma_only: true
  cell_type: cubic_supercell
  vacuum_padding_angstrom: 6.0  # 12.0 OOM'd ferrocene relax (~55GB needed vs 16GB WSL+20GB swap); mt correction doesn't need more
  assume_isolated: mt
  conv_thr: 1.0e-8
  forc_conv_thr: 1.0e-4
  etot_conv_thr: 1.0e-5
  mixing_beta: 0.3
  max_seconds: null
  disk_io: low

closed_shell_phase1:
  nspin: 1
  starting_magnetization: null

required_elements_phase1:
  - Fe
  - C
  - H
  - Ni
  - O
  - Cr
