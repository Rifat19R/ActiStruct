systems:
  primary:
    - ferrocene
    - ni_co4
    - cr_co6
    - fe_co5
  secondary:
    - v_co6
    - benzene_cr_co3
    - ticl4

policy:
  allow_charged_complexes_phase1: false
  allow_sse17_phase1: false
  allow_ml_final_claims: false
  keep_failed_calculations: true
  require_reference_verification: true
