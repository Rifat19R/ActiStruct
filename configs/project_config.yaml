project:
  name: actistruct_tmc_reliability_benchmark
  root_dir: "D:/Research/Dr.Kulik_MIT"
  actistruct_package: actistruct
  actistruct_repo_dir: "D:/Rifat_kh/inverse_active"
  actistruct_version: "0.7.2"
  benchmark_version: v0

paths:
