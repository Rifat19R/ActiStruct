  reports_dir: reports

qe:
  pwx_path_wsl: "/home/duets/q-e-qe-7.4.1/bin/pw.x"
  pwx_on_windows_path: false
  pwx_on_wsl_default_path: false
  run_environment: wsl_ubuntu
  run_user: duets
